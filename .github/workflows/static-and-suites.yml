# Static analysis and the headless suites. See DECISIONS.md AD34 for why this is
# one job with separate steps, why the check is named `static-and-suites`, and
# why lint runs last.
#
# The name is deliberate and must not become `tests` or `build`. A green tick
# here means tsc passed, the fork baseline matched, 13 headless suites passed
# and lint was clean. It means NOTHING about the device behaviour this repo
# depends on -- the highlight mechanism, the pacer clock, auto-scroll, MMKV,
# release-mode Hermes. ARCHITECTURE.md §6 lists what has no automated coverage,
# and none of it is reachable from a runner.
name: static-and-suites

on:
  pull_request:
  push:
    branches: [main]

# No `paths:` filter, ever. A required check with one never reports on an
# unrelated PR, which leaves that PR permanently unmergeable.

permissions:
  contents: read

concurrency:
  group: static-and-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job key IS the required-check name. Renaming it renames the check and
  # silently detaches any branch protection rule pointing at it.
  static-and-suites:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major that every recorded measurement was taken on
      # (AF10, AD27): v26.7.0. The suites are pure Node with no native
      # dependency and no network, so a CI/local split would add a variable
      # with nothing to buy for it.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each check is its OWN step. `npm run check` chains build, baseline and
      # suites behind `&&`, which hides everything after the first failure --
      # the masking AF17 records and that test:core was deliberately written to
      # avoid. In CI that separation is free, so take it.
      - name: Typecheck and core portability guard
        run: npm run build

      # Its own step to preserve AD31's reporting form: "13 suites plus 1
      # baseline check", never "14 suites". This asserts nothing behavioural.
      - name: Core fork baseline
        run: npm run check:baseline

      - name: Headless suites — src/core/ (8 suites)
        run: npm run test:core

      - name: Headless suites — local (5 suites)
        run: npm run test:local

      # Last on purpose: a lint failure must never mask a behavioural one.
      - name: Lint
        run: npm run lint
